<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orakil – Beamer</title>
<style>
  :root {
    --bg-dark: #0b0d12;
    --bg-dark-2: #12151d;
    --marble: #f4efe4;
    --marble-dim: #d9d2c2;
    --gold: #b08d57;
    --gold-light: #d9b878;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background:
      radial-gradient(ellipse at 15% -10%, rgba(176,141,87,0.14), transparent 55%),
      radial-gradient(ellipse at 85% 110%, rgba(176,141,87,0.1), transparent 50%),
      linear-gradient(180deg, var(--bg-dark) 0%, var(--bg-dark-2) 100%);
    color: var(--marble);
    font-family: var(--sans);
  }

  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(1.5px 1.5px at 8% 15%, rgba(244,239,228,0.5), transparent),
      radial-gradient(1.5px 1.5px at 22% 60%, rgba(244,239,228,0.35), transparent),
      radial-gradient(1.5px 1.5px at 40% 25%, rgba(244,239,228,0.4), transparent),
      radial-gradient(1.5px 1.5px at 58% 75%, rgba(244,239,228,0.3), transparent),
      radial-gradient(1.5px 1.5px at 75% 12%, rgba(244,239,228,0.4), transparent),
      radial-gradient(1.5px 1.5px at 88% 55%, rgba(244,239,228,0.3), transparent),
      radial-gradient(1.5px 1.5px at 95% 85%, rgba(244,239,228,0.25), transparent);
    background-size: 100% 100%;
    z-index: 0;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 3vh 4vw 4vh;
  }

  header {
    position: relative;
    z-index: 1;
    text-align: center;
    margin-bottom: 3vh;
  }

  h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 5rem;
    letter-spacing: 0.08em;
    margin: 0;
    background: linear-gradient(180deg, var(--gold-light), var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .columns-row {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-top: 6px;
  }

  .column {
    width: 18px;
    height: 40px;
    background: repeating-linear-gradient(
      90deg,
      var(--marble-dim) 0 3px,
      var(--marble) 3px 6px
    );
    border-top: 4px solid var(--gold);
    opacity: 0.45;
    border-radius: 1px;
  }

  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 1100px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2.4vh;
  }

  .placeholder {
    text-align: center;
    color: var(--marble-dim);
    font-size: 1.4rem;
    margin-top: 8vh;
    font-family: var(--serif);
    font-style: italic;
  }

  .spruch-card {
    background: linear-gradient(160deg, rgba(244,239,228,0.06), rgba(244,239,228,0.02));
    border: 1px solid rgba(176,141,87,0.35);
    border-radius: 8px;
    padding: 2vh 2.6vw;
    filter: blur(10px);
    opacity: 0;
    animation: reveal 1.6s ease-out forwards;
  }

  @keyframes reveal {
    to { filter: blur(0); opacity: 1; }
  }

  .spruch-card p {
    font-family: var(--serif);
    font-size: 1.8rem;
    line-height: 1.5;
    margin: 0;
  }

  .reconnect-hint {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    display: none;
    color: var(--marble-dim);
    font-size: 0.85rem;
    background: rgba(11,13,18,0.7);
    border: 1px solid rgba(176,141,87,0.3);
    border-radius: 20px;
    padding: 6px 16px;
  }
  .reconnect-hint.visible { display: block; }
</style>
</head>
<body>
<div class="stars"></div>
<header>
  <h1>Orakil</h1>
  <div class="columns-row">
    <div class="column"></div><div class="column"></div><div class="column"></div>
    <div class="column"></div><div class="column"></div>
  </div>
</header>

<main id="main">
  <p class="placeholder" id="placeholder">Die ersten Orakelsprüche erscheinen hier in Kürze …</p>
</main>

<div class="reconnect-hint" id="reconnect-hint">Verbindung zum Orakel wird wiederhergestellt …</div>

<script>
  // Nach dem Deploy des Workers hier die echte Worker-URL eintragen.
  const WORKER_URL = "https://super-bird-4f87.david-halser.workers.dev";
  const POLL_INTERVAL_MS = 2500;
  const MAX_VISIBLE = 8;

  const main = document.getElementById("main");
  const placeholder = document.getElementById("placeholder");
  const reconnectHint = document.getElementById("reconnect-hint");

  let knownKeys = new Set();
  let hasContent = false;

  function keyFor(entry) {
    return entry.timestamp + "|" + entry.text;
  }

  function renderNew(entries) {
    for (const entry of entries) {
      const key = keyFor(entry);
      if (knownKeys.has(key)) continue;
      knownKeys.add(key);

      if (!hasContent) {
        placeholder.remove();
        hasContent = true;
      }

      const card = document.createElement("div");
      card.className = "spruch-card";
      const p = document.createElement("p");
      p.textContent = entry.text;
      card.appendChild(p);
      main.prepend(card);
    }

    while (main.children.length > MAX_VISIBLE) {
      main.removeChild(main.lastElementChild);
    }
  }

  async function poll() {
    try {
      const res = await fetch(`${WORKER_URL}/sprueche`, { cache: "no-store" });
      if (!res.ok) throw new Error("http_" + res.status);
      const data = await res.json();
      const entries = Array.isArray(data.sprueche) ? data.sprueche : [];
      // Server liefert neueste zuerst; für stabile Reihenfolge beim Einfügen umkehren
      renderNew([...entries].reverse());
      reconnectHint.classList.remove("visible");
    } catch (err) {
      reconnectHint.classList.add("visible");
    }
  }

  poll();
  setInterval(poll, POLL_INTERVAL_MS);
</script>
</body>
</html>
